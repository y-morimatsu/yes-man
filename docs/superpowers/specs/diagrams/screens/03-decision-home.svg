<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 520" width="280" height="520"
     font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Noto Serif JP', serif">
  <!-- phone outer frame -->
  <rect x="6" y="6" width="268" height="508" rx="28" ry="28"
        fill="#FAFAFA" stroke="#4A3D45" stroke-width="4"/>
  <rect x="14" y="14" width="252" height="492" rx="22" ry="22"
        fill="#FFF7E8"/>
  <!-- notch -->
  <rect x="108" y="14" width="64" height="18" rx="9" fill="#4A3D45"/>
  <!-- status bar -->
  <text x="32" y="48" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#4A3D45">9:41</text>
  <text x="248" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#4A3D45" text-anchor="end">📶 🔋</text>

  <!-- Sticky header (simplified: logo + Sign out) — beige #F5E5C4 -->
  <rect x="14" y="62" width="252" height="40" fill="#F5E5C4"/>
  <text x="26" y="88" font-family="'Noto Serif JP', serif" font-size="14" font-weight="700" fill="#4A3D45">🪞 YesMan</text>
  <text x="254" y="88" font-family="-apple-system, sans-serif" font-size="10" fill="#525252" text-anchor="end">Sign out</text>

  <!-- Page title -->
  <text x="140" y="124" text-anchor="middle" font-family="'Noto Serif JP', serif"
        font-size="16" font-weight="700" fill="#262626">何を きめますか？</text>

  <!-- Input row (input + send button horizontal) -->
  <rect x="26" y="144" width="170" height="32" rx="6" fill="#FFFFFF" stroke="#E0D5BC"/>
  <text x="32" y="164" font-family="-apple-system, sans-serif" font-size="10" fill="#A39B92">今日のランチを決めて</text>
  <rect x="204" y="144" width="50" height="32" rx="6" fill="#E8775A"/>
  <text x="229" y="164" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">→ 送信</text>

  <!-- Voice button (centered, no caption — INCEPTION B2 cleanup) -->
  <rect x="100" y="190" width="80" height="36" rx="10" fill="#E8775A"/>
  <text x="140" y="213" text-anchor="middle" font-family="-apple-system, sans-serif"
        font-size="13" font-weight="600" fill="#FFFFFF">🎙 話す</text>

  <!-- dashed divider -->
  <line x1="26" y1="244" x2="254" y2="244" stroke="#E0D5BC" stroke-dasharray="3 3" stroke-width="0.8"/>

  <!-- Persona pill (inline selector) -->
  <rect x="26" y="256" width="228" height="38" rx="12" fill="#F5F5F4" stroke="#E0D5BC"/>
  <text x="140" y="280" text-anchor="middle" font-family="-apple-system, sans-serif"
        font-size="10" fill="#525252">🛡️ 慎重派 ・ ☀️ 楽観派 ・ ⚡ 効率派 [▼]</text>

  <!-- whisper hint (italic bottom) -->
  <text x="140" y="340" text-anchor="middle" font-family="-apple-system, sans-serif"
        font-style="italic" font-size="10" fill="#A39B92">「決められない」を 委ねよう</text>

  <!-- Bottom Navigation Bar -->
  <rect x="14" y="456" width="252" height="50" fill="#FFFFFF" stroke="#E0E0E0"/>
  <!-- active under-bar for 決定 (tab index 1) -->
  <rect x="78" y="456" width="40" height="2" fill="#c2410c"/>
  <!-- tab 1: Home (inactive) -->
  <text x="46" y="478" text-anchor="middle" font-size="14" fill="#737373">🏠</text>
  <text x="46" y="494" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#737373">Home</text>
  <!-- tab 2: 決定 (ACTIVE) -->
  <text x="98" y="478" text-anchor="middle" font-size="14" fill="#c2410c">💭</text>
  <text x="98" y="494" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#c2410c">決定</text>
  <!-- tab 3: スコア (inactive) -->
  <text x="156" y="478" text-anchor="middle" font-size="14" fill="#737373">📊</text>
  <text x="156" y="494" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#737373">スコア</text>
  <!-- tab 4: プロフィール (inactive) -->
  <text x="220" y="478" text-anchor="middle" font-size="14" fill="#737373">👤</text>
  <text x="220" y="494" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#737373">プロフィール</text>

  <!-- home indicator -->
  <rect x="115" y="506" width="50" height="3" rx="1.5" fill="#4A3D45" opacity="0.6"/>
</svg>
