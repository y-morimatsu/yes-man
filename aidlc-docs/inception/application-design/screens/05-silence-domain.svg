<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 520" width="280" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif">
  <!-- phone outer frame (slightly darker tone for silent mode) -->
  <rect x="6" y="6" width="268" height="508" rx="28" ry="28"
        fill="#37474F" stroke="#263238" stroke-width="4"/>
  <rect x="14" y="14" width="252" height="492" rx="22" ry="22"
        fill="#1A2329"/>
  <rect x="108" y="14" width="64" height="18" rx="9" fill="#0A0A0A"/>
  <text x="32" y="48" font-size="10" font-weight="600" fill="#90A4AE">9:41</text>
  <text x="248" y="48" font-size="10" fill="#90A4AE" text-anchor="end">📶 🔋</text>
  <line x1="22" y1="58" x2="258" y2="58" stroke="#37474F" stroke-width="0.5"/>

  <!-- header (muted) -->
  <text x="32" y="84" font-size="14" font-weight="700" fill="#90A4AE">🪞 YesMan</text>
  <text x="248" y="84" font-size="11" fill="#90A4AE" text-anchor="end">⚙️ 📊 👤</text>

  <!-- centered "..." -->
  <g transform="translate(140 230)">
    <circle r="56" fill="none" stroke="#455A64" stroke-width="0.5" stroke-dasharray="2 4"/>
    <text x="0" y="14" text-anchor="middle" font-size="40" fill="#78909C" font-weight="300">…</text>
  </g>

  <!-- subtle text -->
  <text x="140" y="334" text-anchor="middle" font-size="11" fill="#78909C" font-style="italic">（沈黙）</text>

  <text x="140" y="380" text-anchor="middle" font-size="9" fill="#607D8B">この領域は AI が 代行しません</text>

  <!-- four domain icons faded -->
  <g opacity="0.35">
    <text x="60"  y="430" text-anchor="middle" font-size="16">⛪</text>
    <text x="100" y="430" text-anchor="middle" font-size="16">🗳️</text>
    <text x="180" y="430" text-anchor="middle" font-size="16">⚔️</text>
    <text x="220" y="430" text-anchor="middle" font-size="16">🔞</text>
  </g>
  <text x="140" y="452" text-anchor="middle" font-size="8" fill="#546E7A">宗教 / 選挙 / 暴力 / 卑猥</text>
  <text x="140" y="468" text-anchor="middle" font-size="8" fill="#546E7A">＝ ご自身で 判断する 領域</text>

  <!-- back hint -->
  <text x="140" y="494" text-anchor="middle" font-size="9" fill="#455A64">タップで Home へ もどる</text>

</svg>
