<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 520" width="280" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif">
  <!-- phone outer frame -->
  <rect x="6" y="6" width="268" height="508" rx="28" ry="28"
        fill="#FAFAFA" stroke="#4A3D45" stroke-width="4"/>
  <rect x="14" y="14" width="252" height="492" rx="22" ry="22"
        fill="#FFF7E8"/>
  <!-- notch -->
  <rect x="108" y="14" width="64" height="18" rx="9" fill="#4A3D45"/>
  <!-- status bar -->
  <text x="32" y="48" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#4A3D45">9:41</text>
  <text x="248" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#4A3D45" text-anchor="end">📶 🔋</text>
  <!-- status divider -->
  <line x1="22" y1="58" x2="258" y2="58" stroke="#E0D5BC" stroke-width="0.5"/>

  <!-- header -->
  <rect x="14" y="60" width="252" height="40" fill="#F5E5C4" opacity="0.5"/>
  <text x="32" y="84" font-family="inherit" font-size="14" font-weight="700" fill="#4A3D45">🪞 共有プール</text>
  <text x="248" y="84" font-family="inherit" font-size="11" fill="#4A3D45" text-anchor="end">＋ 新規</text>

  <!-- search/filter -->
  <rect x="32" y="116" width="216" height="28" rx="14" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1"/>
  <text x="48" y="134" font-size="10" fill="#9E9E9E">🔍 ペルソナを 探す...</text>

  <!-- card 1 -->
  <rect x="32" y="158" width="216" height="64" rx="10" fill="#FFFFFF" stroke="#5C6BC0" stroke-width="2"/>
  <circle cx="60" cy="190" r="16" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.5"/>
  <text x="60" y="195" text-anchor="middle" font-size="14">🛡️</text>
  <text x="86" y="180" font-size="11" font-weight="700" fill="#1A237E">慎重派 (組み込み)</text>
  <text x="86" y="194" font-size="8" fill="#9E9E9E">リスクを徹底的に検討する人格</text>
  <text x="86" y="210" font-size="8" fill="#5C6BC0">⭐ 4.8 / 利用 1,247 / 採択率 87%</text>

  <!-- card 2 -->
  <rect x="32" y="232" width="216" height="64" rx="10" fill="#FFFFFF" stroke="#FFB74D" stroke-width="2"/>
  <circle cx="60" cy="264" r="16" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="60" y="269" text-anchor="middle" font-size="14">☀️</text>
  <text x="86" y="254" font-size="11" font-weight="700" fill="#E65100">楽観派 (組み込み)</text>
  <text x="86" y="268" font-size="8" fill="#9E9E9E">ポジティブに背中を押す人格</text>
  <text x="86" y="284" font-size="8" fill="#E65100">⭐ 4.6 / 利用 982 / 採択率 91%</text>

  <!-- card 3 (user shared) -->
  <rect x="32" y="306" width="216" height="64" rx="10" fill="#FFFFFF" stroke="#9F88C8" stroke-width="2"/>
  <circle cx="60" cy="338" r="16" fill="#F3E5F5" stroke="#9F88C8" stroke-width="1.5"/>
  <text x="60" y="343" text-anchor="middle" font-size="14">🎨</text>
  <text x="86" y="328" font-size="11" font-weight="700" fill="#4A148C">芸術家肌 (anon-x42)</text>
  <text x="86" y="342" font-size="8" fill="#9E9E9E">直感と美意識で判断する</text>
  <text x="86" y="358" font-size="8" fill="#9F88C8">⭐ 4.3 / 利用 156 / 採択率 78%</text>

  <!-- card 4 (with FR-PERSONA-04 note) -->
  <rect x="32" y="380" width="216" height="64" rx="10" fill="#FFFFFF" stroke="#66BB6A" stroke-width="2"/>
  <circle cx="60" cy="412" r="16" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="60" y="417" text-anchor="middle" font-size="14">⚡</text>
  <text x="86" y="402" font-size="11" font-weight="700" fill="#1B5E20">効率派 (組み込み)</text>
  <text x="86" y="416" font-size="8" fill="#9E9E9E">最短経路を最優先する人格</text>
  <text x="86" y="432" font-size="8" fill="#1B5E20">⭐ 4.9 / 利用 2,108 / 採択率 95%</text>

  <!-- footer hint -->
  <text x="140" y="468" text-anchor="middle" font-size="9" fill="#9E9E9E">最大 3 個 まで 合議に組込み 可能</text>
  <text x="140" y="484" text-anchor="middle" font-size="8" fill="#BF360C">🔒 共有はオプトイン (FR-PERSONA-04)</text>

</svg>
